name: flutter_application_sayurmayur
description: "Praktikum PAM W6S2S3 - Sayur Mayur si Tegar"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: any
  flutter_screenutil: any
  url_launcher: any
  font_awesome_flutter: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any

flutter:
  uses-material-design: true

  assets:
    - assets/

  fonts:
    - family: Varela
      fonts:
        - asset: fonts/Varela-Regular.ttf
